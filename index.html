<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141412">
<title>Plano e diário alimentar</title>
<style>
@font-face { font-family: "Archivo"; src: url("fontes/Archivo.woff") format("woff"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
@font-face { font-family: "Libre Franklin"; src: url("fontes/LibreFranklin.woff") format("woff"); font-weight: 100 900; font-display: swap; }
:root {
  /* Layout: painéis no estilo de rótulo nutricional (fios pretos, números tabulares) sobre uma página neutra; resumo fixo à esquerda, refeições à direita. */
  --paper: #f7f7f4;
  --surface: #ffffff;
  --ink: #141412;
  --ink-2: #3c3b37;
  --muted: #6b6a64;
  --line: #dddcd5;
  --soft: #efeee9;
  --prot: #2a78d6;
  --carb: #eb6834;
  --fat: #1baf7a;
  --warn: #9a5b00;
  --crit: #c23434;
  --focus: #2a78d6;
  --band: rgba(20,20,18,.045);
  --grid: #e6e5df;
  --bar: #3c3b37;
  --bar-est: #9c9b94;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121211; --surface: #1a1a19; --ink: #f0efec; --ink-2: #d4d3cc; --muted: #a3a29b;
    --line: #34332f; --soft: #232321; --prot: #3987e5; --carb: #d95926; --fat: #199e70;
    --warn: #e0a243; --crit: #e66767; --focus: #6da7ec; --band: rgba(240,239,236,.05);
    --grid: #2b2a27; --bar: #d4d3cc; --bar-est: #6f6e68; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121211; --surface: #1a1a19; --ink: #f0efec; --ink-2: #d4d3cc; --muted: #a3a29b;
  --line: #34332f; --soft: #232321; --prot: #3987e5; --carb: #d95926; --fat: #199e70;
  --warn: #e0a243; --crit: #e66767; --focus: #6da7ec; --band: rgba(240,239,236,.05);
  --grid: #2b2a27; --bar: #d4d3cc; --bar-est: #6f6e68; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--font-body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }

.top { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 3px solid var(--ink); }
.top-in { max-width: 1160px; margin: 0 auto; padding: 12px 20px 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: end; }
.brand h1 { font-family: var(--font-display); font-stretch: 72%; font-weight: 900; font-size: 30px; line-height: .95; margin: 0; letter-spacing: -.005em; }
.brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.top-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.top-r label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
.sync.warn { color: var(--warn); font-weight: 600; }
.sync.crit { color: var(--crit); font-weight: 600; }
.tabs { grid-column: 1 / -1; display: flex; gap: 2px; overflow-x: auto; margin-top: 4px; }
.tabs a { font-family: var(--font-display); font-stretch: 85%; font-weight: 750; font-size: 15px; padding: 8px 14px 8px; color: var(--muted); text-decoration: none; border-radius: 6px 6px 0 0; white-space: nowrap; }
.tabs a:hover { color: var(--ink); background: var(--soft); }
.tabs a[aria-current="page"] { color: var(--paper); background: var(--ink); }

main { max-width: 1160px; margin: 0 auto; padding: 20px 20px 80px; }
.loading, .empty { padding: 40px 0; color: var(--muted); }
.empty h2 { color: var(--ink); font-family: var(--font-display); font-stretch: 80%; margin: 0 0 6px; }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; max-width: 62ch; }
.banner { border: 2px solid var(--warn); color: var(--warn); padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; font-weight: 600; }

input[type="text"], input[type="date"], select, textarea {
  font-size: 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; max-width: 100%;
}
input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; }
input[type="text"]:focus-visible, select:focus-visible, textarea:focus-visible, input[type="date"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
textarea { width: 100%; resize: vertical; }
.in-num { width: 68px; text-align: right; }
.btn { font-weight: 600; font-size: 14px; padding: 6px 12px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: 6px; cursor: pointer; line-height: 1.3; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--ink-2); }
.btn.small { font-size: 13px; padding: 4px 10px; }
.btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding-left: 4px; padding-right: 4px; }
.btn.danger { border-color: var(--crit); color: var(--crit); }
.btn.danger.armed { background: var(--crit); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* cabeçalho do ciclo */
.cy { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: start; margin-bottom: 18px; }
.cy h2 { font-family: var(--font-display); font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: 1; margin: 0; }
.cy .meta { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.cy .notes { font-size: 14px; color: var(--muted); margin: 6px 0 0; max-width: 70ch; }
.cy .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.cy-edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.cy-edit label, .panel label.f { display: grid; gap: 3px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.cy-edit label input, .cy-edit label textarea { text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; }
.cy-edit .wide { grid-column: 1 / -1; }

.panel { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; display: grid; gap: 10px; }
.panel h3 { margin: 0; font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 20px; }
.panel label.f input, .panel label.f select, .panel label.f textarea { text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; }
.panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.radio { display: flex; gap: 6px; align-items: center; font-size: 14px; }

/* plano */
.plan { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
.side { position: sticky; top: 104px; display: grid; gap: 12px; }
@media (max-width: 860px) { .plan { grid-template-columns: 1fr; } .side { position: static; } }

/* painel tipo rótulo */
.label { background: var(--surface); border: 2px solid var(--ink); padding: 10px 14px 12px; }
.lb-t { font-family: var(--font-display); font-stretch: 68%; font-weight: 900; font-size: 30px; line-height: 1; }
.lb-s { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.lb-x { height: 9px; background: var(--ink); margin: 7px -4px 4px; }
.lb-k { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-display); font-weight: 900; font-stretch: 80%; }
.lb-k span { font-size: 18px; }
.lb-k b { font-size: 46px; line-height: 1; font-stretch: 78%; }
.lb-d { font-size: 13px; color: var(--ink-2); margin: 2px 0 0; }
.lb-m { height: 4px; background: var(--ink); margin: 6px -4px 0; }
.lb-h { display: grid; grid-template-columns: 1fr 64px 52px; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 0 2px; text-align: right; }
.mrow { display: grid; grid-template-columns: 12px 1fr 64px 52px; gap: 8px; align-items: center; border-top: 1px solid var(--ink); padding: 5px 0; font-size: 15px; }
.mrow b { text-align: right; }
.mrow span:last-child { text-align: right; color: var(--ink-2); }
.sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c); display: inline-block; }
.split { display: flex; gap: 2px; height: 10px; margin: 6px 0 4px; }
.split span { background: var(--c); border-radius: 2px; min-width: 2px; }
.lb-kg { border-top: 4px solid var(--ink); margin: 8px -4px 0; padding: 8px 4px 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12px; color: var(--ink-2); }
.lb-kg b { display: block; font-family: var(--font-display); font-stretch: 80%; font-weight: 850; font-size: 22px; color: var(--ink); line-height: 1.05; }
.lb-kg small { grid-column: 1 / -1; color: var(--muted); }
.lb-f { font-size: 12px; color: var(--muted); border-top: 4px solid var(--ink); margin: 8px -4px 0; padding: 8px 4px 0; }

.slots { display: grid; gap: 18px; }
.slot { background: var(--surface); border-top: 3px solid var(--ink); }
.slot-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 9px 12px 8px; border-bottom: 1px solid var(--ink); }
.slot-h h3 { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 19px; margin: 0; }
.slot-tot { margin-left: auto; display: flex; gap: 10px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; justify-content: flex-end; }
.slot-tot b { color: var(--ink); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-weight: 600; font-size: 13px; padding: 3px 10px; border: 1.5px solid var(--ink); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; }
.chip small { font-weight: 500; opacity: .75; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.irow { display: grid; grid-template-columns: minmax(0, 1fr) 72px 54px 50px 50px 50px; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.irow:last-child { border-bottom: none; }
.irow .n { text-align: right; font-size: 14px; }
.irow .n.k { font-weight: 600; }
.irow.head { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 5px; padding-bottom: 4px; }
.irow.swapped { background: var(--soft); }
.iname { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; min-width: 0; }
.fn { font-weight: 600; }
.meas { font-size: 12.5px; color: var(--muted); }
.was { font-size: 12px; color: var(--muted); }
.swapw { position: relative; display: inline-block; font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.swapw.on { color: var(--ink); font-weight: 600; }
.swapw select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; padding: 0; border: 0; }
.swapw:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 0 5px; border: 1px solid currentColor; border-radius: 3px; color: var(--muted); white-space: nowrap; line-height: 1.5; }
.tag.rotulo { color: var(--warn); }
.tag.manual { color: var(--prot); }
.iv { font-size: 13px; color: var(--muted); font-style: italic; }
@media (max-width: 620px) {
  .irow { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px 6px; }
  .irow .iname { grid-column: 1 / -1; }
  .irow.head .iname { display: none; }
  .slot-tot { margin-left: 0; width: 100%; justify-content: flex-start; }
}

/* edição */
.slot.edit .slot-h input.in-title { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 18px; flex: 1 1 200px; }
.tools { display: flex; gap: 4px; flex-wrap: wrap; }
.opt-e { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.opt-h { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.opt-h input[type="text"] { font-weight: 600; width: 160px; }
.ie { display: grid; gap: 4px; border-left: 3px solid var(--line); padding-left: 10px; }
.ie-main { display: flex; gap: 6px 8px; align-items: center; flex-wrap: wrap; }
.ie-main select { flex: 1 1 210px; }
.ie-main .ie-m { flex: 1 1 160px; }
.ie-k { font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: right; }
.ie-av { font-size: 13px; display: flex; gap: 4px; align-items: center; }
.link { background: none; border: none; padding: 0; color: var(--ink-2); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.subs { display: grid; gap: 6px; padding: 4px 0 6px 12px; }
.sb { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.sb select { flex: 1 1 200px; }
.sb .ie-m { flex: 1 1 140px; }

/* diário */
.dnav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.dnav h2 { font-family: var(--font-display); font-stretch: 75%; font-weight: 900; font-size: 30px; margin: 0 8px 0 0; line-height: 1; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 18px; max-width: 640px; }
.wd { display: grid; justify-items: center; gap: 1px; padding: 6px 2px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; }
.wd:disabled { opacity: .4; cursor: default; }
.wd.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.wd-n { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.wd b { font-family: var(--font-display); font-stretch: 85%; font-size: 18px; line-height: 1.1; }
.wd .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.wd.st-plano .dot, .wd.st-ajustado .dot { background: var(--ink); border-color: var(--ink); }
.wd.st-ajustado .dot { border-radius: 2px; }
.wd-w { font-size: 11px; color: var(--ink-2); min-height: 15px; }
.wleg { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: -10px 0 16px; flex-wrap: wrap; }
.wleg i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); margin-right: 4px; vertical-align: -1px; }
.wleg i.f { background: var(--ink); border-color: var(--ink); }
.wleg i.q { background: var(--ink); border-color: var(--ink); border-radius: 2px; }
.status { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border: 2px solid var(--ink); background: var(--surface); margin-bottom: 14px; }
.status .pill { font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--ink); }
.status.s-plano .pill, .status.s-ajustado .pill { background: var(--ink); color: var(--paper); }
.status p { margin: 0; font-size: 14px; color: var(--ink-2); flex: 1 1 260px; }
.dslot .slot-h select { font-weight: 600; }
.livre { padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.skip { padding: 10px 12px; font-size: 14px; color: var(--muted); }
.extras { margin-top: 18px; }
.extras h3 { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 19px; margin: 0; }
.exadd { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; }
.exadd select { flex: 1 1 220px; }
.body-p .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.energy { display: flex; gap: 4px; }
.energy .chip { min-width: 34px; }
.small-note { font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; }

/* evolução */
.ev-h { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.ev-h h2 { font-family: var(--font-display); font-stretch: 75%; font-weight: 900; font-size: 30px; margin: 0 8px 0 0; line-height: 1; }
.charts { position: relative; background: var(--surface); border-top: 3px solid var(--ink); padding: 8px 0 4px; }
.ch-t { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; padding: 4px 12px 0; }
.ch-t h3 { font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: 17px; margin: 0; }
.leg { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.leg i { display: inline-block; vertical-align: -1px; margin-right: 5px; }
.leg .l-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.leg .l-line { width: 18px; height: 2px; background: var(--ink); vertical-align: 3px; }
.leg .l-bar { width: 10px; height: 10px; border-radius: 2px; background: var(--bar); }
.leg .l-est { width: 10px; height: 10px; border-radius: 2px; background: repeating-linear-gradient(45deg, var(--bar-est) 0 1.5px, transparent 1.5px 4px); border: 1px solid var(--bar-est); }
.chart { width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart-empty { padding: 26px 12px; color: var(--muted); font-size: 14px; margin: 0; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12.5px; line-height: 1.4; padding: 7px 9px; border-radius: 6px; max-width: 240px; z-index: 3; }
.tip b { font-weight: 700; }
.tblw { overflow-x: auto; margin-top: 22px; background: var(--surface); border-top: 3px solid var(--ink); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 760px; }
.tbl th { text-align: right; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px 6px; border-bottom: 1px solid var(--ink); }
.tbl td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child, .tbl th:nth-child(2), .tbl td:nth-child(2) { text-align: left; }
.tbl td small { display: block; color: var(--muted); font-size: 12px; }
.tbl td:first-child { font-weight: 600; }

/* alimentos */
.fh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.fh h2 { font-family: var(--font-display); font-stretch: 75%; font-weight: 900; font-size: 30px; margin: 0 8px 0 0; line-height: 1; }
.fh #food-q { flex: 0 1 240px; }
.tags-leg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin: 10px 0 14px; align-items: center; }
.ftable { background: var(--surface); border-top: 3px solid var(--ink); }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px 64px 64px 60px auto; gap: 8px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line); }
.frow.head { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--ink); }
.frow.head span { text-align: right; }
.frow.head span:first-child { text-align: left; }
.frow .in-num { width: 100%; }
.fname input { width: 100%; font-weight: 600; }
.fsrc { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.fuse { font-size: 12px; color: var(--muted); text-align: right; }
@media (max-width: 720px) {
  .frow { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .frow .fname { grid-column: 1 / -1; }
  .frow.head { display: none; }
  .frow .fuse { grid-column: 1 / 3; text-align: left; }
  .frow .fdel { grid-column: 3 / -1; justify-self: end; }
  .frow label.mob { display: grid; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
}
@media (min-width: 721px) { .frow label.mob > span { display: none; } }
.dlayout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.dlayout .side { order: 2; }
@media (max-width: 860px) { .dlayout { grid-template-columns: 1fr; } .dlayout .side { order: -1; position: static; } }
@media (max-width: 620px) {
  .top { position: static; }
  .top-in { grid-template-columns: 1fr; padding: 10px 16px 0; }

<script>
/* Configuração do login Microsoft e do Microsoft Graph. */
const CFG = Object.assign({
  clientId: 'b00a9395-4ab6-44d7-b0c5-c93562d2ae1e',
  authority: 'https://login.microsoftonline.com/consumers',
  graph: 'https://graph.microsoft.com/v1.0',
  scopes: 'openid profile offline_access Files.ReadWrite.AppFolder',
}, window.__PA_TEST__ || {});
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');

/* Login com a conta Microsoft pessoal: fluxo "authorization code" com PKCE, sem biblioteca externa. */
const Auth = (() => {
  const KEY = 'pa.auth';
  const store = (area) => ({
    get: k => { try { return area().getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { area().setItem(k, v); } catch (e) { /* sem armazenamento */ } },
    del: k => { try { area().removeItem(k); } catch (e) { /* sem armazenamento */ } },
  });
  const ls = store(() => localStorage), ss = store(() => sessionStorage);
  let st = null;
  try { st = JSON.parse(ls.get(KEY) || 'null'); } catch (e) { st = null; }
  const save = () => (st ? ls.set(KEY, JSON.stringify(st)) : ls.del(KEY));
  const b64url = bytes => { let t = ''; new Uint8Array(bytes).forEach(x => { t += String.fromCharCode(x); }); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); };
  function jwt(t) {
    try {
      let p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      p += '='.repeat((4 - (p.length % 4)) % 4);
      const bin = atob(p), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch (e) { return {}; }
  }
  const erro = (code, message, extra) => Object.assign(new Error(message), { code }, extra || {});
  async function login(opts) {
    opts = opts || {};
    const verifier = rnd(48);
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    const state = rnd(16);
    ss.set('pa.pkce', JSON.stringify({ verifier, state, silent: !!opts.silent }));
    ss.set('pa.hash', location.hash || '');
    const q = new URLSearchParams({ client_id: CFG.clientId, response_type: 'code', redirect_uri: REDIRECT, response_mode: 'query', scope: CFG.scopes, state, code_challenge: challenge, code_challenge_method: 'S256' });
    const hint = st && st.account && st.account.username;
    if (opts.silent) q.set('prompt', 'none');
    else if (!hint) q.set('prompt', 'select_account');
    if (hint) q.set('login_hint', hint);
    location.assign(CFG.authority + '/oauth2/v2.0/authorize?' + q.toString());
  }
  async function tokenRequest(params) {
    const body = new URLSearchParams(Object.assign({ client_id: CFG.clientId, scope: CFG.scopes }, params));
    let r;
    try { r = await fetch(CFG.authority + '/oauth2/v2.0/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body }); }
    catch (e) { throw erro('unavailable', 'Sem conexão com a Microsoft.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const code = (j.error === 'invalid_grant' || j.error === 'interaction_required') ? 'login_required' : (r.status >= 500 ? 'unavailable' : 'auth_error');
      throw erro(code, j.error_description || j.error || ('Erro ' + r.status), { detail: j.error || '' });
    }
    return j;
  }
  function keep(j) {
    const idc = j.id_token ? jwt(j.id_token) : null;
    st = {
      at: j.access_token,
      rt: j.refresh_token || (st && st.rt) || null,
      exp: Date.now() + (j.expires_in || 3600) * 1000,
      account: idc ? { name: idc.name || '', username: idc.preferred_username || idc.email || '' } : (st && st.account) || null,
    };
    save();
  }
  async function handleRedirect() {
    const u = new URL(location.href);
    const code = u.searchParams.get('code'), err = u.searchParams.get('error'), state = u.searchParams.get('state');
    if (!code && !err) return null;
    let pk = null;
    try { pk = JSON.parse(ss.get('pa.pkce') || 'null'); } catch (e) { pk = null; }
    ss.del('pa.pkce');
    const hash = ss.get('pa.hash') || '';
    ss.del('pa.hash');
    history.replaceState(null, '', REDIRECT + hash);
    if (!pk || pk.state !== state) return { error: 'state', description: 'A resposta do login não corresponde ao pedido. Tente entrar de novo.' };
    if (err) return { error: err, description: u.searchParams.get('error_description') || '', silent: pk.silent };
    keep(await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: pk.verifier }));
    ss.del('pa.silent');
    return { ok: true };
  }
  let refreshing = null;
  async function token(force) {
    if (!force && st && st.at && st.exp - Date.now() > 120000) return st.at;
    if (!st || !st.rt) throw erro('login_required', 'Entre com a sua conta Microsoft.');
    if (!refreshing) {
      refreshing = tokenRequest({ grant_type: 'refresh_token', refresh_token: st.rt })
        .then(j => { keep(j); return st.at; })
        .finally(() => { refreshing = null; });
    }
    try { return await refreshing; }
    catch (e) { if (e.code === 'login_required') { st = Object.assign({}, st, { at: null, rt: null }); save(); } throw e; }
  }
  return {
    login, handleRedirect, token,
    loggedIn: () => !!(st && (st.rt || (st.at && st.exp > Date.now()))),
    account: () => (st && st.account) || null,
    canSilent: () => !!(st && st.account && st.account.username) && ss.get('pa.silent') !== '1',
    markSilent: () => ss.set('pa.silent', '1'),
    logout: () => { st = null; save(); ss.del('pa.silent'); location.assign(CFG.authority + '/oauth2/v2.0/logout?post_logout_redirect_uri=' + encodeURIComponent(REDIRECT)); },
  };
})();

/* Armazenamento: um arquivo JSON por documento numa pasta própria do app no OneDrive
   (Aplicativos/Plano alimentar/dados), no mesmo formato da versão do PC. */
const GraphDB = (() => {
  const meta = { fromCache: false, hasPendingWrites: false };
  const erro = (code, message) => Object.assign(new Error(message), { code });
  let statusFn = () => {};
  const ROOT = CFG.graph + '/me/drive/special/approot';
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const at = rel => ROOT + ':/' + enc(rel) + ':';
  const cache = new Map();
  async function call(method, url, opts, retried) {
    opts = opts || {};
    let tok;
    try { tok = await Auth.token(retried); }
    catch (e) { throw erro(e.code === 'unavailable' ? 'unavailable' : 'revoked', e.message); }
    let r;
    try {
      r = await fetch(url, { method, cache: 'no-store', headers: Object.assign({ Authorization: 'Bearer ' + tok }, opts.headers || {}), body: opts.body });
    } catch (e) { statusFn(false); throw erro('unavailable', 'Sem conexão com o OneDrive.'); }
    statusFn(true);
    if (r.status === 401 && !retried) return call(method, url, opts, true);
    if (r.status === 403) throw erro('forbidden', 'A Microsoft não liberou o acesso à pasta do app (' + await why(r) + ').');
    if (r.status === 401) throw erro('revoked', 'A Microsoft recusou o acesso.');
    if (r.status === 429 || r.status === 503 || r.status === 504) throw erro('unavailable', 'O OneDrive pediu para esperar um pouco.');
    return r;
  }
  async function why(r) {
    let t = '';
    try { const j = await r.clone().json(); if (j && j.error) t = (j.error.code || '') + (j.error.message ? ': ' + j.error.message : ''); } catch (e) { /* sem corpo */ }
    return 'HTTP ' + r.status + (t ? ' — ' + t : '');
  }
  async function download(it) {
    const url = it['@microsoft.graph.downloadUrl'];
    let r;
    try { r = url ? await fetch(url, { cache: 'no-store' }) : await call('GET', CFG.graph + '/me/drive/items/' + encodeURIComponent(it.id) + '/content'); }
    catch (e) { if (e.code) throw e; throw erro('unavailable', 'Falha ao baixar um arquivo do OneDrive.'); }
    if (!r.ok) throw erro('unavailable', 'Erro ' + r.status + ' ao baixar ' + it.name + '.');
    const txt = (await r.text()).replace(/^﻿/, '');
    try { return JSON.parse(txt); } catch (e) { console.warn('Arquivo ilegível ignorado:', it.name); return null; }
  }
  async function pool(list, n, fn) {
    let i = 0;
    const run = async () => { while (i < list.length) { const x = list[i++]; await fn(x); } };
    await Promise.all(Array.from({ length: Math.min(n, list.length) }, run));
  }
  async function readDoc(path) {
    const r = await call('GET', at('dados/' + path + '.json'));
    if (r.status === 404) { cache.delete(path); return { exists: false }; }
    if (!r.ok) throw erro('unavailable', 'Não consegui ler ' + path + ' (' + await why(r) + ').');
    const it = await r.json();
    const c = cache.get(path);
    if (c && c.etag && c.etag === it.eTag) return { exists: c.data != null, data: c.data };
    const data = await download(it);
    cache.set(path, { etag: it.eTag, data });
    return { exists: data != null, data };
  }
  async function readCol(path) {
    const found = [], seen = new Set();
    let url = at('dados/' + path) + '/children?$top=200';
    while (url) {
      const r = await call('GET', url);
      if (r.status === 404) break;
      if (!r.ok) throw erro('unavailable', 'Não consegui listar ' + path + ' (' + await why(r) + ').');
      const j = await r.json();
      for (const it of (j.value || [])) {
        if (!it.file || !/\.json$/i.test(it.name)) continue;
        const id = it.name.replace(/\.json$/i, '');
        if (!/^[A-Za-z0-9_\-.]{1,120}$/.test(id)) continue;
        const key = path + '/' + id;
        seen.add(key);
        const c = cache.get(key);
        found.push(c && c.etag && c.etag === it.eTag ? { id, data: c.data } : { id, it, key });
      }
      url = j['@odata.nextLink'] || null;
    }
    await pool(found.filter(d => d.it), 6, async d => { d.data = await download(d.it); cache.set(d.key, { etag: d.it.eTag, data: d.data }); delete d.it; });
    for (const k of [...cache.keys()]) if (k.startsWith(path + '/') && k.indexOf('/', path.length + 1) < 0 && !seen.has(k)) cache.delete(k);
    return found.filter(d => d.data && typeof d.data === 'object').sort((x, y) => (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
  }
  async function mkdirs(path) {
    const parts = ('dados/' + path).split('/').slice(0, -1);
    for (let i = 0; i < parts.length; i++) {
      const parent = parts.slice(0, i).join('/');
      const r = await call('POST', (parent ? at(parent) : ROOT) + '/children', { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: parts[i], folder: {}, '@microsoft.graph.conflictBehavior': 'fail' }) });
      if (!r.ok && r.status !== 409) throw erro('unavailable', 'Não consegui criar a pasta ' + parts.slice(0, i + 1).join('/') + ' (' + await why(r) + ').');
    }
  }
  async function writeDoc(path, data) {
    const body = JSON.stringify(data, null, 1) + '\n';
    const put = () => call('PUT', at('dados/' + path + '.json') + '/content', { headers: { 'Content-Type': 'application/json' }, body });
    let r = await put();
    if (r.status === 404) { await mkdirs(path); r = await put(); }
    if (!r.ok) {
      if (r.status === 507) throw erro('quota_exceeded', 'O OneDrive está sem espaço.');
      if (r.status === 400 || r.status === 409) throw erro('invalid_argument', 'O OneDrive recusou o arquivo.');
      throw erro('unavailable', 'Não consegui salvar (' + await why(r) + ').');
    }
    const it = await r.json().catch(() => null);
    cache.set(path, { etag: it && it.eTag, data: JSON.parse(body) });
  }
  async function deleteDoc(path) {
    const r = await call('DELETE', at('dados/' + path + '.json'));
    if (!r.ok && r.status !== 404) throw erro('unavailable', 'Não consegui apagar (' + await why(r) + ').');
    cache.delete(path);
  }
  const subs = new Set();
  let timer = null;
  async function refresh(s) {
    if (s.kind === 'doc') {
      const res = await readDoc(s.path);
      s.cb({ id: s.path.split('/').pop(), exists: res.exists, data: () => (res.exists ? res.data : undefined), metadata: meta });
    } else {
      const res = await readCol(s.path);
      const docs = res.map(d => ({ id: d.id, exists: true, data: () => d.data, metadata: meta }));
      s.cb({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: meta });
    }
  }
  let polling = false;
  async function poll() {
    if (polling) return;
    polling = true;
    try { for (const s of [...subs]) await refresh(s); }
    catch (e) { if (e.code === 'revoked') for (const s of [...subs]) if (s.onErr) s.onErr(e); }
    finally { polling = false; }
  }
  function start() {
    if (timer) return;
    timer = setInterval(() => { if (document.visibilityState === 'visible') poll(); }, 20000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') poll(); });
  }
  function listen(kind, path, cb, onErr) {
    const s = { kind, path, cb, onErr };
    subs.add(s); start();
    refresh(s).catch(e => { subs.delete(s); if (onErr) onErr(e); });
    return () => subs.delete(s);
  }
  function doc(path) {
    return {
      id: path.split('/').pop(), path,
      get: async () => { const res = await readDoc(path); return { id: path.split('/').pop(), exists: res.exists, data: () => res.data, metadata: meta }; },
      set: data => writeDoc(path, data),
      delete: () => deleteDoc(path),
      onSnapshot: (cb, onErr) => listen('doc', path, cb, onErr),
    };
  }
  const collection = path => ({ path, doc: id => doc(path + '/' + id), onSnapshot: (cb, onErr) => listen('col', path, cb, onErr) });
  async function ping() {
    let r = await call('GET', ROOT);
    if (r.status === 404) {
      /* Numa conta nova a pasta do app só passa a existir na primeira gravação. */
      const w = await call('PUT', ROOT + ':/LEIA-ME.txt:/content', { headers: { 'Content-Type': 'text/plain; charset=utf-8' }, body: 'Pasta de dados do Plano e diário alimentar (https://gabriel-mottagm.github.io/plano-alimentar/).\nOs ciclos, alimentos e registros ficam na subpasta dados/. Não apague esta pasta.\n' });
      if (!w.ok) throw erro('unavailable', 'Não consegui criar a pasta do app no OneDrive (' + await why(w) + ').');
      r = await call('GET', ROOT);
    }
    if (!r.ok) throw erro('unavailable', 'Não consegui abrir a pasta do app no OneDrive (' + await why(r) + ').');
    return true;
  }
  return { doc, collection, ping, onStatus: fn => { statusFn = fn; } };
})();
</script>
<script>
(() => {
'use strict';
const VIEWS = ['plano', 'diario', 'evolucao', 'alimentos'];
const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const NF0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const NF1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
const NF2 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2, minimumFractionDigits: 2 });

const viewEl = document.getElementById('view');
const syncEl = document.getElementById('sync');
const acctEl = document.getElementById('acct');
const logoutBtn = document.getElementById('logoutBtn');
let logoutArmed = false;
const cycleSel = document.getElementById('cycleSel');

const S = {
  foods: [], F: {}, cycles: [], days: {},
  loaded: { foods: false, cycles: false, days: false },
  mode: 'loading', ready: false, saveError: null,
  view: VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'plano',
  cycleId: null, editing: false, sim: { opt: {}, sub: {} }, openSubs: new Set(),
  newCycle: null, confirm: null, saveDraft: null, cmp: {}, eqHint: {}, taco: null,
  date: todayStr(), ex: { food: '', g: '' },
  range: 'all', foodQ: '', nf: null, imp: null, flash: null, offline: false, authMsg: '', authExpired: false,
  series: [],
};

/* ---------- utilidades ---------- */
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const toD = s => new Date(s + 'T12:00:00Z');
const fromD = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => fromD(new Date(toD(s).getTime() + n * 864e5));
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
const fmtDate = s => { if (!s) return ''; const d = toD(s); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear(); };
const fmtDM = s => { const d = toD(s); return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0'); };
const fmtLong = s => { const d = toD(s); return WD[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).trim().replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const fmtK = v => NF0.format(Math.round(v || 0));
const fmtG = v => NF1.format(Math.round((v || 0) * 10) / 10);
const fmtW = v => (v == null ? '' : new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(v));
const fmtIn = v => v == null || v === '' ? '' : String(Math.round(v * 100) / 100).replace('.', ',');
const sgn = (v, f) => { const t = f(Math.abs(v)); return (t === '0' ? '±' : v > 0 ? '+' : '−') + t; };
const uid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

const EQ_NOME = { p: 'proteína', c: 'carboidrato', g: 'gordura', kcal: 'calorias' };
const EQ_MESMA = { p: 'mesma proteína', c: 'mesmo carboidrato', g: 'mesma gordura', kcal: 'mesmas calorias' };
const eqBase = f => (f && f.eq ? f.eq : 'kcal');
/* Quantidade de 'toId' equivalente a 'fromG' g de 'fromId'. Padrão: mesmas calorias. Se os dois alimentos tiverem
   o mesmo macro escolhido na aba Alimentos (proteína, carboidrato ou gordura), iguala esse macro. */
function equivalent(fromId, fromG, toId) {
  const a = S.F[fromId], b = S.F[toId];
  if (!a || !b || !(fromG > 0)) return null;
  const ba = eqBase(a), bb = eqBase(b);
  let base = ba === bb ? ba : 'kcal';
  const val = (f, k) => (k === 'kcal' ? f.kcal : f[k]) || 0;
  if (!(val(a, base) > 0) || !(val(b, base) > 0)) base = 'kcal';
  if (!(val(a, base) > 0) || !(val(b, base) > 0)) return null;
  let g = fromG * val(a, base) / val(b, base);
  g = g < 10 ? Math.round(g * 2) / 2 : Math.round(g);
  const txt = ba !== bb
    ? `Critérios diferentes (${EQ_NOME[ba]} × ${EQ_NOME[bb]}): ${EQ_MESMA.kcal} de ${fmtG(fromG)} g de ${a.name}.`
    : `${EQ_MESMA[base].charAt(0).toUpperCase() + EQ_MESMA[base].slice(1)} de ${fmtG(fromG)} g de ${a.name}.`;
  return { g, base, txt };
}

function rebuildF() { S.F = {}; for (const f of S.foods) S.F[f.id] = f; }
const foodName = id => (S.F[id] ? S.F[id].name : (id ? 'Alimento removido' : 'Escolha um alimento'));
function mac(foodId, g) {
  const f = S.F[foodId], r = Z();
  if (!f || !g) return r;
  const k = g / 100;
  r.kcal = (f.kcal || 0) * k; r.p = (f.p || 0) * k; r.c = (f.c || 0) * k; r.g = (f.g || 0) * k;
  return r;
}
function compute(cycle, sel) {
  sel = sel || {};
  const out = { slots: [], extras: [], tot: Z() };
  if (!cycle) return out;
  for (const s of cycle.slots) {
    let choice = sel.opt && sel.opt[s.id] != null ? sel.opt[s.id] : (s.def || 0);
    if (typeof choice === 'number' && !s.options[choice]) choice = 0;
    const row = { slot: s, choice, items: [], tot: Z(), opt: null };
    if (choice === 'livre') {
      const k = num(sel.livre && sel.livre[s.id]);
      row.livre = k; if (k) row.tot.kcal = k;
    } else if (choice !== 'skip') {
      const o = s.options[choice];
      row.opt = o;
      if (o) for (const it of o.items) {
        const si = sel.sub && sel.sub[it.id] != null ? sel.sub[it.id] : -1;
        const sub = si >= 0 && it.subs && it.subs[si] ? it.subs[si] : null;
        const base = sub || it;
        const gOv = sel.grams && sel.grams[it.id] != null ? sel.grams[it.id] : null;
        const g = gOv != null ? gOv : (base.g || 0);
        const m = mac(base.food, g);
        row.items.push({ it, sub, si: sub ? si : -1, food: base.food, g, m: base.m || '', mac: m, gOv: gOv != null });
        addM(row.tot, m);
      }
    }
    addM(out.tot, row.tot);
    out.slots.push(row);
  }
  for (const e of (sel.extras || [])) {
    const m = mac(e.food, e.g);
    out.extras.push(Object.assign({}, e, { mac: m }));
    addM(out.tot, m);
  }

}

function weekStrip(d) {
  const dow = (toD(d).getUTCDay() + 6) % 7, mon = addDays(d, -dow), t = todayStr();

  for (let i = 0; i < 7; i++) {

  }
  return h + '</div>';
}
function dSlot(row, def) {
  const s = row.slot;

  const diff = dr ? row.tot.kcal - dr.tot.kcal : 0;

/* --- Evolução --- */
function buildSeries() {
  const t = todayStr();
  const starts = S.cycles.filter(c => !c.draft).map(c => c.start).filter(Boolean).concat(Object.keys(S.days)).filter(x => x <= t).sort();
  if (!starts.length) return [];
  let start = starts[0];
  if (S.range === '30') start = start > addDays(t, -29) ? start : addDays(t, -29);
  if (S.range === '90') start = start > addDays(t, -89) ? start : addDays(t, -89);
  const n = daysBetween(start, t) + 1;
  const ser = [];
  for (let i = 0; i < n; i++) {
    const d = addDays(start, i), info = dayInfo(d);
    const doc = info.doc;
    ser.push({ d, kcal: info.cyc ? info.r.tot.kcal : null, p: info.cyc ? info.r.tot.p : null, logged: info.logged, cyc: info.cyc, w: doc && doc.weight != null ? doc.weight : null, bf: doc && doc.bf != null ? doc.bf : null, avg: null });
  }
  for (let i = 0; i < n; i++) {
    let s = 0, k = 0;
    for (let j = Math.max(0, i - 6); j <= i; j++) if (ser[j].w != null) { s += ser[j].w; k++; }
    ser[i].avg = k >= 2 ? s / k : null;
  }
  return ser;
}
function cycleStats(c) {
  const t = todayStr();
  if (!c.start || c.start > t) return null;
  const end = c.end && c.end < t ? c.end : t;
  const n = daysBetween(c.start, end) + 1;
  let kcal = 0, p = 0, g = 0, logged = 0;
  const ws = [];
  for (let i = 0; i < n; i++) {
    const d = addDays(c.start, i), info = dayInfo(d);
    kcal += info.r.tot.kcal; p += info.r.tot.p; g += info.r.tot.g; if (info.logged) logged++;
    if (info.doc && info.doc.weight != null) ws.push({ x: i, y: info.doc.weight });
  }
  const avgW = ws.length ? ws.reduce((a, b) => a + b.y, 0) / ws.length : null;
  const first = ws.filter(o => o.x <= 6), last = ws.filter(o => o.x >= n - 7);
  const mean = a => a.length ? a.reduce((s, o) => s + o.y, 0) / a.length : null;
  let slope = null;
  if (ws.length >= 3 && ws[ws.length - 1].x - ws[0].x >= 7) {
    const mx = ws.reduce((a, o) => a + o.x, 0) / ws.length, my = avgW;
    let num_ = 0, den = 0;
    for (const o of ws) { num_ += (o.x - mx) * (o.y - my); den += (o.x - mx) * (o.x - mx); }
    slope = den ? num_ / den * 7 : null;
  }
  return { n, end, kcal: kcal / n, p: p / n, g: g / n, logged, ws: ws.length, avgW, w1: mean(first), w2: mean(last), slope };
}
function vEvo() {
  S.series = buildSeries();
  const ser = S.series;
  const head = `<div class="ev-h"><h2>Evolução</h2>
    <div class="chips" role="group" aria-label="Período">${[['30', '30 dias'], ['90', '90 dias'], ['all', 'Tudo']].map(([k, l]) => `<button class="chip" data-act="ev-range" data-k="${k}" aria-pressed="${S.range === k}">${l}</button>`).join('')}</div></div>`;
  if (!ser.length) return head + '<div class="empty"><p>Ainda não há ciclos nem dias registrados.</p></div>';
  const rows = S.cycles.filter(c => !c.draft).sort((a, b) => (a.start || '').localeCompare(b.start || '')).map(c => {
    const st = cycleStats(c);
    if (!st) return `<tr><td>${esc(c.name)}</td><td>${c.start ? 'Começa em ' + fmtDate(c.start) : 'Sem datas'}</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`;
    return `<tr>
      <td>${esc(c.name)}</td>
      <td>${fmtDM(c.start)} → ${c.end ? fmtDM(c.end) : 'hoje'}<small>${st.n} dias</small></td>

function drawCharts() {
  const ser = S.series, n = ser.length;

  const gw = xGeom(elW, n), HW = 200, mtW = 18, mbW = 22, phW = HW - mtW - mbW;

  else {

    if (hi - lo < 1) { const m = (hi + lo) / 2; lo = m - 0.5; hi = m + 0.5; }
    const step = niceStep(hi - lo, 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;

  hk += `<rect class="hit" x="${gk.ml}" y="0" width="${gk.pw}" height="${HK}" style="fill:transparent"/>`;

  doc.updated = new Date().toISOString();
  queueSave('days/' + d, doc);
}
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  const a = el.dataset.act, ds = el.dataset;
  if (ds.confirm) {
    if (S.confirm !== ds.confirm) { S.confirm = ds.confirm; render(); return; }
    S.confirm = null;
  } else if (S.confirm) S.confirm = null;
  const c = cyc();
  switch (a) {
    case 'sim-opt': { const k = +ds.k, s = c.slots.find(x => x.id === ds.s); if (s && k !== (s.def || 0)) S.sim.opt[ds.s] = k; else delete S.sim.opt[ds.s]; break; }
    case 'sim-reset': S.sim = { opt: {}, sub: {} }; break;
    case 'edit-toggle': S.editing = !S.editing; S.newCycle = null; S.eqHint = {}; break;
    case 'nc-open': { const src = c && !c.draft ? c : lastNonDraft(); S.newCycle = { name: 'Nova dieta', src: src ? src.id : '' }; S.saveDraft = null; break; }
    case 'nc-cancel': S.newCycle = null; break;
    case 'nc-create': {
      const n = S.newCycle; if (!n) break;
      const src = n.src ? cycById(n.src) : null;
      const base = src || lastNonDraft();
      const obj = { id: uid('c'), name: (n.name || 'Nova dieta').trim(), draft: true, base: base ? base.id : '', start: '', end: '', notes: src ? 'Baseada em “' + src.name + '”.' : '', slots: src ? clone(src.slots) : [] };
      S.cycles.push(obj); S.cycles.sort((x, y) => (x.start || '').localeCompare(y.start || ''));
      saveCycle(obj); S.cycleId = obj.id; lsSet('plano.cycleId', obj.id); S.newCycle = null; S.editing = true; S.sim = { opt: {}, sub: {} }; S.eqHint = {};
      break;
    }
    case 'dr-save-open': S.saveDraft = { start: todayStr(), close: true }; break;
    case 'dr-save-cancel': S.saveDraft = null; break;
    case 'dr-save': {
      const n = S.saveDraft; if (!c || !c.draft || !n) break;
      const start = n.start || todayStr();
      const prev = S.cycles.find(x => x.id !== c.id && !x.draft && x.start && x.start < start && (!x.end || x.end >= start));
      if (prev && n.close) { prev.end = addDays(start, -1); saveCycle(prev); }
      delete c.draft; c.start = start; c.end = '';
      S.cycles.sort((x, y) => (x.start || '').localeCompare(y.start || ''));
      saveCycle(c); S.saveDraft = null; S.editing = false; S.eqHint = {};
      break;
    }
    case 'cy-del': {
      if (!c) break;
      S.cycles = S.cycles.filter(x => x.id !== c.id); queueDelete('cycles/' + c.id);
      const nx = (c.draft && cycById(c.base)) || cycleForDate(todayStr()) || lastNonDraft() || null;
      S.cycleId = nx ? nx.id : null; S.editing = false; break;
    }
    case 'sl-add': c.slots.push({ id: uid('s'), name: 'Nova refeição', def: 0, options: [{ id: uid('o'), label: 'Padrão', items: [] }] }); saveCycle(c); break;
    case 'sl-up': case 'sl-down': {
      const i = c.slots.findIndex(x => x.id === ds.s), j = a === 'sl-up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= c.slots.length) break;
      [c.slots[i], c.slots[j]] = [c.slots[j], c.slots[i]]; saveCycle(c); break;
    }
    case 'sl-del': c.slots = c.slots.filter(x => x.id !== ds.s); saveCycle(c); break;
    case 'op-add': { const { s } = loc(c, ds.s); if (!s) break; s.options.push({ id: uid('o'), label: 'Opção ' + (s.options.length + 1), items: [] }); saveCycle(c); break; }
    case 'op-del': {
      const { s } = loc(c, ds.s); if (!s || s.options.length < 2) break;
      const i = s.options.findIndex(o => o.id === ds.o); s.options.splice(i, 1);
      if ((s.def || 0) >= s.options.length || s.def === i) s.def = 0; else if (s.def > i) s.def--;
      saveCycle(c); break;
    }
    case 'it-add': { const { o } = loc(c, ds.s, ds.o); if (!o) break; o.items.push({ id: uid('i'), food: '', g: 0, m: '', av: false, subs: [] }); saveCycle(c); break; }
    case 'it-del': { const { o } = loc(c, ds.s, ds.o); if (!o) break; o.items = o.items.filter(x => x.id !== ds.i); saveCycle(c); break; }
    case 'toggle-subs': if (S.openSubs.has(ds.i)) S.openSubs.delete(ds.i); else S.openSubs.add(ds.i); break;
    case 'sb-add': { const { it } = loc(c, ds.s, ds.o, ds.i); if (!it) break; it.subs = it.subs || []; it.subs.push({ food: '', g: 0, m: '' }); S.openSubs.add(it.id); saveCycle(c); break; }
    case 'sb-del': { const { it } = loc(c, ds.s, ds.o, ds.i); if (!it) break; it.subs.splice(+ds.k, 1); saveCycle(c); break; }
    /* diário */
    case 'd-prev': S.date = addDays(S.date, -1); break;
    case 'd-next': if (S.date < todayStr()) S.date = addDays(S.date, 1); break;
    case 'd-today': S.date = todayStr(); break;
    case 'd-pick': S.date = ds.d; break;
    case 'd-follow': { const doc = dayDoc(); doc.status = 'plano'; doc.opt = {}; doc.sub = {}; doc.grams = {}; doc.livre = {}; doc.extras = []; saveDay(); break; }
    case 'd-undo': { const doc = dayDoc(); doc.status = null; saveDay(); break; }
    case 'd-energy': { const doc = dayDoc(); const k = +ds.k; doc.energy = doc.energy === k ? null : k; saveDay(); break; }
    case 'd-ex-add': {
      const g = num(S.ex.g);
      if (!S.ex.food || !g) { const t = document.getElementById(!S.ex.food ? 'd-ex-food' : 'd-ex-g'); if (t) t.focus(); return; }
      const doc = dayDoc(); doc.extras.push({ id: uid('x'), food: S.ex.food, g }); adjust(doc); S.ex = { food: '', g: '' }; saveDay(); break;
    }
    case 'd-ex-del': { const doc = dayDoc(); doc.extras = doc.extras.filter(x => x.id !== ds.x); adjust(doc); saveDay(); break; }
    /* evolução */
    case 'ev-range': S.range = ds.k; break;
    /* alimentos */
    case 'taco-open': S.taco = { q: '' }; break;
    case 'taco-close': S.taco = null; break;
    case 'taco-add': {
      const t = TACO.find(x => x[0] === +ds.t); if (!t) break;
      const id = 'taco-' + t[0];
      if (!S.F[id]) { S.foods.push({ id, name: t[1], kcal: t[2], p: t[3], c: t[4], g: t[5], src: 'taco', ref: 'TACO #' + t[0] + ' — ' + t[1], note: '' }); rebuildF(); saveFoods(); }
      break;
    }
    case 'nf-open': S.nf = { name: '', mode: '100', por: '', kcal: '', p: '', c: '', g: '', ref: '', err: '' }; break;
    case 'nf-cancel': S.nf = null; break;
    case 'nf-add': {
      const nf = S.nf; if (!nf) break;
      const vals = ['kcal', 'p', 'c', 'g'].map(k => num(nf[k]));
      const por = num(nf.por);
      if (!nf.name.trim()) nf.err = 'Dê um nome ao alimento.';
      else if (vals.some(v => v == null || v < 0)) nf.err = 'Preencha calorias, proteína, carboidrato e gordura (use 0 quando não houver).';
      else if (nf.mode === 'por' && !(por > 0)) nf.err = 'Informe o tamanho da porção em gramas.';
      else {
        const f = nf.mode === 'por' ? 100 / por : 1;
        const r1 = v => Math.round(v * f * 10) / 10;
        const food = { id: uid('f'), name: nf.name.trim(), kcal: Math.round(vals[0] * f), p: r1(vals[1]), c: r1(vals[2]), g: r1(vals[3]), src: 'manual', ref: nf.ref.trim() || 'Cadastrado por você', note: nf.mode === 'por' ? `Convertido de uma porção de ${fmtG(por)} g.` : '' };
        S.foods.push(food); rebuildF(); saveFoods(); S.nf = null;
      }
      break;
    }
    case 'fd-del': S.foods = S.foods.filter(f => f.id !== ds.f); rebuildF(); saveFoods(); break;
    case 'backup': {
      const txt = JSON.stringify({ exportado: new Date().toISOString(), foods: S.foods, cycles: S.cycles, days: S.days }, null, 1);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
      a.download = 'plano-alimentar-backup-' + todayStr() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      S.flash = 'backup';
      setTimeout(() => { S.flash = null; if (S.view === 'alimentos') render(); }, 1800);
      break;
    }
    case 'imp-open': S.imp = { data: null, err: '' }; break;
    case 'imp-cancel': S.imp = null; break;
    case 'login': Auth.login(); return;
    case 'imp-go': {
      const d = S.imp && S.imp.data; if (!d) break;
      S.foods = clone(d.foods); rebuildF(); saveFoods();
      for (const c of d.cycles) { const i = S.cycles.findIndex(x => x.id === c.id); const cc = clone(c); if (i >= 0) S.cycles[i] = cc; else S.cycles.push(cc); saveCycle(cc); }
      S.cycles.sort((x, y) => (x.start || '').localeCompare(y.start || ''));
      for (const k of Object.keys(d.days)) { S.days[k] = clone(d.days[k]); queueSave('days/' + k, S.days[k]); }
      if (!cyc() && S.cycles.length) S.cycleId = (cycleForDate(todayStr()) || S.cycles[S.cycles.length - 1]).id;
      S.imp = null; break;

    default: return;

}
function onChange(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.act) return;
  if (el.dataset.act === 'imp-file' && S.imp) {
    const f = el.files && el.files[0]; if (!f) return;
    f.text().then(txt => { S.imp = Object.assign({ data: null, err: '' }, parseBackup(txt)); render(); });
    return;
  }
  if (el.dataset.act === 'imp-text' && S.imp) { S.imp = Object.assign({ data: null, err: '' }, parseBackup(el.value)); render(); return; }
  if (el.id === 'cycleSel') return;
  const a = el.dataset.act, ds = el.dataset, v = el.type === 'checkbox' ? el.checked : el.value;
  const c = cyc();
  let delay = 250;
  switch (a) {
    case 'sim-sub': { const k = +v; if (k < 0) delete S.sim.sub[ds.i]; else S.sim.sub[ds.i] = k; delay = 0; break; }
    case 'cy-name': if (c) { c.name = v.trim() || 'Ciclo sem nome'; saveCycle(c); } break;
    case 'cy-start': if (c) { c.start = v; S.cycles.sort((x, y) => (x.start || '').localeCompare(y.start || '')); saveCycle(c); } break;
    case 'cy-end': if (c) { c.end = v; saveCycle(c); } break;
    case 'cy-notes': if (c) { c.notes = v; saveCycle(c); } break;
    case 'nc-name': if (S.newCycle) S.newCycle.name = v; delay = 9999; break;
    case 'nc-src': if (S.newCycle) S.newCycle.src = v; delay = 9999; break;
    case 'sd-start': if (S.saveDraft) S.saveDraft.start = v; delay = 0; break;
    case 'sd-close': if (S.saveDraft) S.saveDraft.close = v; delay = 0; break;
    case 'cmp-sel': if (c) { if (c.draft) { c.base = v; saveCycle(c); } else if (v) S.cmp[c.id] = v; else delete S.cmp[c.id]; } delay = 0; break;
    case 'fd-eq': { const f = S.F[ds.f]; if (f) { if (v) f.eq = v; else delete f.eq; saveFoods(); } delay = 0; break; }
    case 'sl-name': { const { s } = loc(c, ds.s); if (s) { s.name = v.trim() || 'Refeição'; saveCycle(c); } break; }
    case 'op-label': { const { o } = loc(c, ds.s, ds.o); if (o) { o.label = v.trim() || 'Opção'; saveCycle(c); } break; }
    case 'op-def': { const { s } = loc(c, ds.s); if (s) { s.def = +ds.k; delete S.sim.opt[s.id]; saveCycle(c); } delay = 0; break; }
    case 'it-food': {
      const { it } = loc(c, ds.s, ds.o, ds.i); if (!it) break;
      const r = it.food && v ? equivalent(it.food, it.g, v) : null;
      it.food = v;
      if (r) { it.g = r.g; S.eqHint[it.id] = r.txt; } else delete S.eqHint[it.id];
      saveCycle(c); delay = 0; break;
    }
    case 'it-g': { const { it } = loc(c, ds.s, ds.o, ds.i); if (it) { it.g = Math.max(0, num(v) || 0); delete S.eqHint[it.id]; saveCycle(c); } break; }
    case 'it-m': { const { it } = loc(c, ds.s, ds.o, ds.i); if (it) { it.m = v; saveCycle(c); } delay = 9999; break; }
    case 'it-av': { const { it } = loc(c, ds.s, ds.o, ds.i); if (it) { it.av = !!v; if (v && !it.m) it.m = 'à vontade'; saveCycle(c); } delay = 0; break; }
    case 'sb-food': {
      const { it } = loc(c, ds.s, ds.o, ds.i); const sb = it && it.subs[+ds.k]; if (!sb) break;
      sb.food = v;
      const r = v ? equivalent(it.food, it.g, v) : null;
      if (r) { sb.g = r.g; S.eqHint[it.id + '-' + ds.k] = r.txt; } else delete S.eqHint[it.id + '-' + ds.k];
      saveCycle(c); delay = 0; break;
    }
    case 'sb-g': { const { it } = loc(c, ds.s, ds.o, ds.i); if (it && it.subs[+ds.k]) { it.subs[+ds.k].g = Math.max(0, num(v) || 0); delete S.eqHint[it.id + '-' + ds.k]; saveCycle(c); } break; }
    case 'sb-m': { const { it } = loc(c, ds.s, ds.o, ds.i); if (it && it.subs[+ds.k]) { it.subs[+ds.k].m = v; saveCycle(c); } delay = 9999; break; }
    /* diário */
    case 'd-date': if (v) S.date = v > todayStr() ? todayStr() : v; delay = 0; break;
    case 'd-opt': {
      const doc = dayDoc(); const info = dayInfo(S.date); const s = info.cyc && info.cyc.slots.find(x => x.id === ds.s);
      if (!s) break;
      if (v === 'skip' || v === 'livre') doc.opt[s.id] = v;
      else if (+v === (s.def || 0)) delete doc.opt[s.id];
      else doc.opt[s.id] = +v;
      if (v !== 'livre') delete doc.livre[s.id];
      adjust(doc); saveDay(); delay = 0; break;
    }
    case 'd-sub': { const doc = dayDoc(); const k = +v; if (k < 0) delete doc.sub[ds.i]; else doc.sub[ds.i] = k; delete doc.grams[ds.i]; adjust(doc); saveDay(); delay = 0; break; }
    case 'd-g': {
      const doc = dayDoc(); const g = num(v);
      const info = dayInfo(S.date);
      let base = null;
      if (info.cyc) for (const r of compute(info.cyc, doc).slots) for (const x of r.items) if (x.it.id === ds.i) base = x.sub ? x.sub.g : x.it.g;
      if (g == null || g === base) delete doc.grams[ds.i]; else doc.grams[ds.i] = Math.max(0, g);
      adjust(doc); saveDay(); break;
    }
    case 'd-livre': { const doc = dayDoc(); const k = num(v); if (k == null) delete doc.livre[ds.s]; else doc.livre[ds.s] = Math.max(0, k); adjust(doc); saveDay(); break; }
    case 'd-ex-food': S.ex.food = v; delay = 9999; break;
    case 'd-ex-gnew': S.ex.g = v; delay = 9999; break;
    case 'd-ex-g': { const doc = dayDoc(); const x = doc.extras.find(o => o.id === ds.x); const g = num(v); if (x && g != null) { x.g = Math.max(0, g); adjust(doc); saveDay(); } break; }
    case 'd-w': { const doc = dayDoc(); const w = num(v); doc.weight = w != null && w > 20 && w < 300 ? Math.round(w * 10) / 10 : null; saveDay(); break; }
    case 'd-bf': { const doc = dayDoc(); const b = num(v); doc.bf = b != null && b > 1 && b < 70 ? Math.round(b * 10) / 10 : null; saveDay(); break; }
    case 'd-note': { const doc = dayDoc(); doc.note = v.trim() || null; saveDay(); delay = 9999; break; }
    /* alimentos */
    case 'fd-name': { const f = S.F[ds.f]; if (f) { f.name = v.trim() || f.name; saveFoods(); } break; }
    case 'fd-v': {
      const f = S.F[ds.f]; const n = num(v);
      if (f && n != null && n >= 0 && n !== f[ds.k]) {
        if (f.src !== 'manual') { f.note = (f.note ? f.note + ' ' : '') + `Original: ${f.ref} (${f.kcal} kcal, P ${f.p}, C ${f.c}, G ${f.g}).`; f.src = 'manual'; f.ref = 'Editado por você'; }
        f[ds.k] = ds.k === 'kcal' ? Math.round(n) : Math.round(n * 10) / 10; saveFoods();
      }
      break;
    }
    case 'nf-f': if (S.nf) S.nf[ds.k] = v; delay = 9999; break;
    case 'nf-mode': if (S.nf) S.nf.mode = v; delay = 0; break;
    default: return;
  }
  if (delay < 9999) scheduleRender(delay); else setSync();
}
function onInput(e) {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'food-q') { S.foodQ = el.value; render(); }
  else if (el.dataset && el.dataset.act === 'taco-q' && S.taco) { S.taco.q = el.value; render(); }
  else if (el.dataset && el.dataset.act === 'nf-f' && S.nf) S.nf[el.dataset.k] = el.value;
  else if (el.dataset && el.dataset.act === 'd-ex-gnew') S.ex.g = el.value;
}
document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('input', onInput);
cycleSel.addEventListener('change', () => {
  S.cycleId = cycleSel.value || null; lsSet('plano.cycleId', S.cycleId || '');
  S.sim = { opt: {}, sub: {} }; S.editing = false; S.newCycle = null; render();
});
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (VIEWS.includes(v) && v !== S.view) { S.view = v; S.confirm = null; render(); window.scrollTo(0, 0); }
});
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.view === 'evolucao' && S.ready) drawCharts(); }, 150); });

logoutBtn.addEventListener('click', () => {
  if (S.authExpired) { Auth.login(); return; }
  if (!logoutArmed) { logoutArmed = true; setSync(); setTimeout(() => { logoutArmed = false; setSync(); }, 4000); return; }
  Auth.logout();
});
renderHeader(); setSync();
initDb();
})();
